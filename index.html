<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Roblox clone waves</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
  --axis:#c3c2b7;--border:rgba(11,11,11,.10);--accent:#2a78d6;--tint:#e4eefb;--up:#006300;--down:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
  --muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--tint:#1d2b3e;--up:#0ca30c;--down:#e66767}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:650}
.meta{color:var(--ink2)}
header a{margin-left:auto;color:var(--accent);text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.tile,.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.tile{padding:14px 16px;min-width:0}
.label{color:var(--ink2);font-size:12.5px}

.delta{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.filters input{flex:1 1 240px;max-width:360px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;color:var(--ink2);background:var(--surface);border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--tint);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-items:start}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{padding:16px 16px 10px;min-width:0}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rank{color:var(--muted);font-weight:600}
h2{font-size:17px;margin:0;font-weight:650}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink);white-space:nowrap}
.tag{font-size:11.5px;color:var(--ink2);border:1px solid var(--border);padding:1px 8px;border-radius:999px;white-space:nowrap}
.pattern{color:var(--ink2);margin:6px 0 12px}
.stats{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:22px;align-items:end;margin-bottom:12px}
.spark{position:relative;min-height:40px}
.spark svg{display:block;width:100%;height:auto;max-height:64px;overflow:visible}
.spark .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .base,.spark .hair{stroke:var(--axis);stroke-width:1;vector-effect:non-scaling-stroke}
.spark .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark .empty{color:var(--muted);font-size:12px;text-align:right;padding-bottom:2px}
.games{list-style:none;margin:0;padding:0;border-top:1px solid var(--grid)}
.games li+li{border-top:1px solid var(--grid)}
.games a{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;color:inherit;text-decoration:none;border-radius:8px}
.games a:hover,.games a:focus-visible{background:var(--tint);outline:none}
.icon{width:44px;height:44px;border-radius:9px;background:var(--grid);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-weight:600}
.gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsub{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gccu{font-weight:600;text-align:right;min-width:56px}
.gccu small{display:block;font-weight:400;color:var(--muted);font-size:11px}
details{margin-top:6px;color:var(--ink2);font-size:12.5px}
summary{cursor:pointer;padding:4px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-bottom:6px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500}
td+td,th+th{text-align:right}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;
  box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:12.5px;display:none;z-index:10}
.tip b{display:block;font-size:14px}
.tip span{color:var(--ink2)}
.empty-state{grid-column:1/-1;color:var(--ink2);padding:40px 0;text-align:center}
.gone{margin-top:28px}
.gone h3{font-size:14px;margin:0 0 8px;color:var(--ink2);font-weight:600}
.gone ul{margin:0;padding-left:18px;color:var(--ink2)}
footer{margin-top:32px;color:var(--muted);font-size:12px}
</style>
</head>

const fmt = n => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n);
const full = n => n.toLocaleString('en');
const when = t => t.replace('_', ' ').replace(/(\d\d)(\d\d)$/, '$1:$2');
const runs = D.runs.slice(-30), cur = runs[runs.length - 1], prev = runs.length > 1 ? runs[runs.length - 2] : null;
const prevGames = D.prevGames ? new Set(D.prevGames) : null;

function el(tag, attrs, ...kids) {  // strings become text nodes: titles from Roblox never become HTML
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
function svg(tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
const tip = document.getElementById('tip');
function showTip(e, strong, sub) {
  tip.replaceChildren(el('b', null, strong), el('span', null, sub));
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

function delta(d, unit) {
  if (d == null) return el('div', {class: 'delta'}, prev ? ' ' : 'first run');
  if (d === 0) return el('div', {class: 'delta'}, 'no change' + unit);
  return el('div', {class: 'delta ' + (d > 0 ? 'up' : 'down')}, (d > 0 ? '▲ +' : '▼ −') + fmt(Math.abs(d)) + unit);
}

const waves = D.waves.map((w, i) => {
  const p = prev && prev.waves[w.name];
  return Object.assign({}, w, {rank: i + 1, n: w.ids.length, isNew: !!prev && !p,
    dCcu: p ? w.ccu - p[0] : null, dN: p ? w.ids.length - p[1] : null,
    hay: [w.name, w.pattern].concat(w.ids.map(id => D.games[id].name)).join(' ').toLowerCase()});
});
const gone = prev ? Object.entries(prev.waves).filter(([name]) => !cur.waves[name]) : [];

function tile(label, value, sub, isName) {
  return el('div', {class: 'tile'}, el('div', {class: 'label'}, label),
    el('div', {class: 'value' + (isName ? ' name' : ''), title: value}, value), sub);
}
function drawTiles() {
  const total = waves.reduce((s, w) => s + w.ccu, 0);
  const prevTotal = prev ? Object.values(prev.waves).reduce((s, v) => s + v[0], 0) : null;
  const biggest = waves[0];
  const grower = waves.filter(w => w.dCcu > 0).sort((a, b) => b.dCcu - a.dCcu)[0];
  const newCount = waves.filter(w => w.isNew).length;
  document.getElementById('tiles').append(
    tile('Clone waves on the charts', String(waves.length),
      el('div', {class: 'delta'}, prev ? newCount + ' new · ' + gone.length + ' faded since last run' : 'first run')),
    tile('Players in those waves', fmt(total), delta(prevTotal == null ? null : total - prevTotal, ' since last run')),
    tile('Biggest wave', biggest ? biggest.name : '—',
      el('div', {class: 'delta'}, biggest ? full(biggest.ccu) + ' players · ' + biggest.n + ' games' : ''), true),
    tile('Fastest growing', grower ? grower.name : '—',
      grower ? delta(grower.dCcu, ' players since last run') : el('div', {class: 'delta'}, prev ? 'no wave grew' : 'needs a second run'), true));
}

function spark(w) {
  const pts = runs.map((r, i) => r.waves[w.name] ? {i, t: r.time, v: r.waves[w.name][0], n: r.waves[w.name][1]} : null);
  const have = pts.filter(Boolean);
  const box = el('div', {class: 'spark'});
  if (have.length < 2) { box.append(el('div', {class: 'empty'}, 'Trend line starts after the next run')); return box; }
  const W = 240, H = 56, max = Math.max(...have.map(p => p.v)) || 1;
  const x = i => i / (runs.length - 1) * W, y = v => H - v / max * (H - 6);
  let d = '', pen = false;
  pts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1); pen = true; });
  const last = have[have.length - 1];
  const hair = svg('line', {class: 'hair', y1: 0, y2: H, visibility: 'hidden'});
  const dot = svg('circle', {class: 'dot', r: 4, cx: x(last.i), cy: y(last.v)});
  const s = svg('svg', {viewBox: `-4 -4 ${W + 8} ${H + 8}`, role: 'img',
    'aria-label': `Players in this wave over the last ${have.length} runs`});
  s.append(svg('line', {class: 'base', x1: 0, x2: W, y1: H, y2: H}), svg('path', {class: 'line', d}));
  pts.forEach((p, i) => {  // a run with no neighbours draws no line, so mark it with a small dot
    if (p && !pts[i - 1] && !pts[i + 1]) s.append(svg('circle', {class: 'dot', r: 2.5, cx: x(p.i), cy: y(p.v)}));
  });
  s.append(hair, dot);
  s.addEventListener('pointermove', e => {
    const r = s.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * (W + 8) - 4;
    const p = have.reduce((a, b) => Math.abs(x(b.i) - fx) < Math.abs(x(a.i) - fx) ? b : a);
    hair.setAttribute('x1', x(p.i)); hair.setAttribute('x2', x(p.i)); hair.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(p.i)); dot.setAttribute('cy', y(p.v));
    showTip(e, full(p.v) + ' players', when(p.t) + ' · ' + p.n + ' games');
  });
  s.addEventListener('pointerleave', () => {
    hair.setAttribute('visibility', 'hidden'); dot.setAttribute('cx', x(last.i)); dot.setAttribute('cy', y(last.v)); hideTip();
  });
  box.append(s);
  return box;
}

function gameRow(id) {
  const g = D.games[id];
  const icon = g.icon && g.icon.startsWith('https://')
    ? el('img', {class: 'icon', src: g.icon, alt: '', loading: 'lazy'})
    : el('div', {class: 'icon'}, (g.name.match(/[A-Za-z0-9]/) || ['?'])[0]);
  const ranks = Object.entries(g.charts).map(([c, r]) => c + ' #' + r).join(', ');
  const sub = [ranks, g.genre, g.created && 'created ' + g.created].filter(Boolean).join(' · ');
  const fresh = prevGames && !prevGames.has(String(id));
  return el('li', null, el('a', {href: 'https://www.roblox.com/games/' + Number(g.place), target: '_blank', rel: 'noopener', title: g.desc || null},
    icon, el('div', {style: 'min-width:0'}, el('div', {class: 'gname'}, g.name), el('div', {class: 'gsub'}, sub)),
    fresh ? el('span', {class: 'badge'}, 'New on charts') : el('span'),
    el('div', {class: 'gccu'}, fmt(g.ccu), el('small', null, 'playing'))));
}

function history(w) {
  const rows = runs.filter(r => r.waves[w.name]).reverse().map(r =>
    el('tr', null, el('td', null, when(r.time)), el('td', null, full(r.waves[w.name][0])), el('td', null, String(r.waves[w.name][1]))));
  return el('details', null, el('summary', null, 'Run history'),
    el('table', null, el('thead', null, el('tr', null, el('th', null, 'Run'), el('th', null, 'Players'), el('th', null, 'Games'))),
      el('tbody', null, ...rows)));
}

function card(w) {
  const tag = {title: 'Title match', gameplay: 'Gameplay match', both: 'Title + gameplay match'}[w.match] || w.match;
  const games = [...w.ids].sort((a, b) => D.games[b].ccu - D.games[a].ccu);
  return el('article', {class: 'card'},
    el('div', {class: 'head'}, el('span', {class: 'rank'}, '#' + w.rank), el('h2', null, w.name),
      w.isNew ? el('span', {class: 'badge'}, 'New wave') : null, el('span', {class: 'tag'}, tag)),
    el('p', {class: 'pattern'}, w.pattern),
    el('div', {class: 'stats'},
      el('div', null, el('div', {class: 'label'}, 'Players now'), el('div', {class: 'value'}, fmt(w.ccu)),
        w.isNew ? el('div', {class: 'delta'}, 'new this run') : delta(w.dCcu, '')),
      el('div', null, el('div', {class: 'label'}, 'Games'), el('div', {class: 'value'}, String(w.n)),
        el('div', {class: 'delta'}, w.dN == null ? ' ' : w.dN === 0 ? 'no change' : (w.dN > 0 ? '+' : '−') + Math.abs(w.dN))),
      spark(w)),
    el('ul', {class: 'games'}, ...games.map(gameRow)),
    history(w));
}

let match = 'all';
function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const key = {ccu: w => -w.ccu, games: w => -w.n, new: w => (w.isNew ? 0 : 1e12) - w.ccu,
    growth: w => w.dCcu == null ? 1e12 : -w.dCcu}[document.getElementById('sort').value];
  const list = waves.filter(w => (match === 'all' || w.match === match || w.match === 'both') && (!q || w.hay.includes(q)))
    .sort((a, b) => key(a) - key(b));
  document.getElementById('waves').replaceChildren(...(list.length ? list.map(card)
    : [el('p', {class: 'empty-state'}, waves.length ? 'No waves match that filter.' : 'No clone waves on the charts this run.')]));
}

document.getElementById('meta').textContent =
  when(D.time) + ' · ' + D.count + ' games on ' + D.charts.join(' + ') + ' · grouped by ' + D.model;
drawTiles();
if (gone.length) document.getElementById('gone').append(el('h3', null, 'Waves that faded since last run'),
  el('ul', null, ...gone.map(([name, v]) => el('li', null, name + ': had ' + full(v[0]) + ' players across ' + v[1] + ' games'))));
document.querySelectorAll('#match button').forEach(b => b.addEventListener('click', () => {
  match = b.dataset.v;
  document.querySelectorAll('#match button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  draw();
}));
document.getElementById('q').addEventListener('input', draw);
document.getElementById('sort').addEventListener('change', draw);
draw();
</script>
