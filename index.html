</style>

const fmt = n => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(n);
const full = n => n.toLocaleString('en');
const asDate = t => new Date(t.slice(0, 10) + 'T' + t.slice(11, 13) + ':' + t.slice(13, 15));
const nice = t => asDate(t).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
const day = t => asDate(t).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
const base = D.base, since = base ? ' since ' + nice(base.time) : '';
const baseGames = base ? new Set(base.games) : null;
const waveOf = {};
D.waves.forEach(w => w.ids.forEach(id => { waveOf[id] = w.name; }));

function el(tag, attrs, ...kids) {  // strings become text nodes: titles from Roblox never become HTML
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
function svg(tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
const tip = document.getElementById('tip');
function showTip(e, strong, sub) {
  tip.replaceChildren(el('b', null, strong), el('span', null, sub));
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
const link = g => 'https://www.roblox.com/games/' + Number(g.place);
const icon = (g, cls) => g.icon && g.icon.startsWith('https://')
  ? el('img', {class: cls, src: g.icon, alt: '', loading: 'lazy'})
  : el('div', {class: cls}, (g.name.match(/[A-Za-z0-9]/) || ['?'])[0]);

function delta(d) {
  if (d == null) return el('div', {class: 'delta'}, ' ');
  if (d === 0) return el('div', {class: 'delta'}, 'no change');
  return el('div', {class: 'delta ' + (d > 0 ? 'up' : 'down')}, (d > 0 ? '▲ +' : '▼ −') + fmt(Math.abs(d)));
}

const waves = D.waves.map(w => {
  const p = base && base.waves[w.name];
  return Object.assign({}, w, {n: w.ids.length, isNew: !!base && !p,
    dCcu: p ? w.ccu - p[0] : null, dN: p ? w.ids.length - p[1] : null,
    hay: [w.name, w.pattern].concat(w.ids.map(id => D.games[id].name)).join(' ').toLowerCase()});
});
const names = new Set(waves.map(w => w.name));
const gone = base ? Object.entries(base.waves).filter(([name]) => !names.has(name)) : [];

function tile(label, value, sub, isName) {
  return el('div', {class: 'tile'}, el('div', {class: 'label'}, label),
    el('div', {class: 'value' + (isName ? ' name clamp' : ''), title: value}, value), sub);
}
function drawTiles() {
  const biggest = waves[0];
  const grower = waves.filter(w => w.dCcu > 0).sort((a, b) => b.dCcu - a.dCcu)[0];
  const fresh = waves.filter(w => w.isNew);
  const sub = (text, cls) => el('div', {class: 'delta ' + (cls || '')}, text);
  document.getElementById('tiles').append(
    tile('Biggest trend', biggest ? biggest.name : 'None yet',
      sub(biggest ? fmt(biggest.ccu) + ' playing · ' + biggest.n + ' games' : ''), true),
    tile('Growing fastest', grower ? grower.name : '—',
      grower ? sub('▲ +' + fmt(grower.dCcu) + ' players' + since, 'up') : sub(base ? 'No trend grew' + since : 'Shows after tomorrow’s update'), true),
    tile('New trends', base ? String(fresh.length) : '—',
      sub(!base ? 'Shows after tomorrow’s update' : fresh.length ? fresh.slice(0, 2).map(w => w.name).join(', ') +
        (fresh.length > 2 ? ' and ' + (fresh.length - 2) + ' more' : '') : 'None' + since)),
    tile('Games on the charts', String(D.count), sub(waves.length + ' trends found among them')));
}

let chart = D.charts.includes('Top Trending') ? 'Top Trending' : D.charts[0];
function drawTop() {
  document.querySelectorAll('#chartTabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === chart)));
  document.getElementById('top').replaceChildren(...(D.top[chart] || []).map(id => {
    const g = D.games[id];
    return el('a', {class: 'tg', href: link(g), target: '_blank', rel: 'noopener', title: g.desc || null},
      el('div', {class: 'tg-img'}, icon(g, 'tg-icon'), el('span', {class: 'tg-rank'}, '#' + g.charts[chart])),
      el('div', {class: 'tg-name clamp'}, g.name),
      el('div', {class: 'tg-sub'}, fmt(g.ccu) + ' playing'),
      waveOf[id] ? el('div', {class: 'tg-wave', title: 'Part of the trend: ' + waveOf[id]}, waveOf[id]) : null);
  }));
}

function spark(w) {
  const pts = D.days.map((r, i) => r.waves[w.name] ? {i, t: r.time, v: r.waves[w.name][0], n: r.waves[w.name][1]} : null);
  const have = pts.filter(Boolean);
  const box = el('div', {class: 'spark'}, el('div', {class: 'label'}, 'Playing, per day'));
  if (have.length < 2) { box.append(el('div', {class: 'empty'}, 'Line starts after a second day')); return box; }
  const W = 240, H = 56, max = Math.max(...have.map(p => p.v)) || 1;
  const x = i => i / (D.days.length - 1) * W, y = v => H - v / max * (H - 6);
  let d = '', pen = false;
  pts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1); pen = true; });
  const last = have[have.length - 1];
  const hair = svg('line', {class: 'hair', y1: 0, y2: H, visibility: 'hidden'});
  const dot = svg('circle', {class: 'dot', r: 4, cx: x(last.i), cy: y(last.v)});
  const s = svg('svg', {viewBox: `-4 -4 ${W + 8} ${H + 8}`, role: 'img', 'aria-label': `Players per day, last ${have.length} days`});
  s.append(svg('line', {class: 'base', x1: 0, x2: W, y1: H, y2: H}), svg('path', {class: 'line', d}));
  pts.forEach((p, i) => {  // a day with no neighbours draws no line, so mark it with a small dot
    if (p && !pts[i - 1] && !pts[i + 1]) s.append(svg('circle', {class: 'dot', r: 2.5, cx: x(p.i), cy: y(p.v)}));
  });
  s.append(hair, dot);
  s.addEventListener('pointermove', e => {
    const r = s.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * (W + 8) - 4;
    const p = have.reduce((a, b) => Math.abs(x(b.i) - fx) < Math.abs(x(a.i) - fx) ? b : a);
    hair.setAttribute('x1', x(p.i)); hair.setAttribute('x2', x(p.i)); hair.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(p.i)); dot.setAttribute('cy', y(p.v));
    showTip(e, full(p.v) + ' playing', day(p.t) + ' · ' + p.n + ' games');
  });
  s.addEventListener('pointerleave', () => {
    hair.setAttribute('visibility', 'hidden'); dot.setAttribute('cx', x(last.i)); dot.setAttribute('cy', y(last.v)); hideTip();
  });
  box.append(s);
  return box;
}

function gameRow(id) {
  const g = D.games[id];
  const ranks = Object.entries(g.charts).map(([c, r]) => c + ' #' + r).join(', ');
  const sub = [ranks, g.genre, g.created && 'created ' + g.created].filter(Boolean).join(' · ');
  const fresh = baseGames && !baseGames.has(String(id));
  return el('li', null, el('a', {href: link(g), target: '_blank', rel: 'noopener', title: g.desc || null},
    icon(g, 'icon'), el('div', {style: 'min-width:0'}, el('div', {class: 'gname'}, g.name), el('div', {class: 'gsub'}, sub)),
    fresh ? el('span', {class: 'badge'}, 'New on charts') : el('span'),
    el('div', {class: 'gccu'}, fmt(g.ccu), el('small', null, 'playing'))));
}

function history(w) {
  const rows = D.days.filter(r => r.waves[w.name]).reverse().map(r =>
    el('tr', null, el('td', null, day(r.time)), el('td', null, full(r.waves[w.name][0])), el('td', null, String(r.waves[w.name][1]))));
  return el('details', null, el('summary', null, 'Daily history'),
    el('table', null, el('thead', null, el('tr', null, el('th', null, 'Day'), el('th', null, 'Playing'), el('th', null, 'Games'))),
      el('tbody', null, ...rows)));
}

function card(w) {
  const tag = {title: 'Same title idea', gameplay: 'Same gameplay', both: 'Same title & gameplay'}[w.match] || w.match;
  const ids = [...w.ids].sort((a, b) => D.games[b].ccu - D.games[a].ccu);
  const list = el('ul', {class: 'games'}, ...ids.map((id, i) => { const li = gameRow(id); li.hidden = i >= 5; return li; }));
  let more = null;
  if (ids.length > 5) {
    more = el('button', {class: 'more', type: 'button'}, 'Show all ' + ids.length + ' games');
    more.addEventListener('click', () => {
      const open = more.textContent.startsWith('Show all');
      [...list.children].forEach((li, i) => { li.hidden = !open && i >= 5; });
      more.textContent = open ? 'Show fewer' : 'Show all ' + ids.length + ' games';
    });
  }
  return el('article', {class: 'card'},
    el('div', {class: 'head'}, el('h3', null, w.name), w.isNew ? el('span', {class: 'badge'}, 'New trend') : null, el('span', {class: 'tag'}, tag)),
    el('p', {class: 'pattern'}, w.pattern),
    el('div', {class: 'stats'},
      el('div', null, el('div', {class: 'label'}, 'Playing now'), el('div', {class: 'value'}, fmt(w.ccu)),
        w.isNew ? el('div', {class: 'delta'}, 'new trend') : delta(w.dCcu)),
      el('div', null, el('div', {class: 'label'}, 'Games'), el('div', {class: 'value'}, String(w.n)),
        el('div', {class: 'delta'}, w.dN == null ? ' ' : w.dN === 0 ? 'no change' : (w.dN > 0 ? '+' : '−') + Math.abs(w.dN))),
      spark(w)),
    list, more, history(w));
}

let match = 'all';
function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const key = {ccu: w => -w.ccu, games: w => -w.n, new: w => (w.isNew ? 0 : 1e12) - w.ccu,
    growth: w => w.dCcu == null ? 1e12 : -w.dCcu}[document.getElementById('sort').value];
  const list = waves.filter(w => (match === 'all' || w.match === match || w.match === 'both') && (!q || w.hay.includes(q)))
    .sort((a, b) => key(a) - key(b));
  document.getElementById('waves').replaceChildren(...(list.length ? list.map(card)
    : [el('p', {class: 'empty-state'}, waves.length ? 'No trends match that search.' : 'No trends on the charts right now.')]));
}

document.getElementById('meta').textContent = 'Updated ' + nice(D.time) + ' · from Roblox’s ' + D.charts.join(' and ') + ' charts';
if (D.headline) { document.getElementById('headline').textContent = D.headline; document.getElementById('summary').hidden = false; }
document.getElementById('trendNote').textContent = 'Games grouped because they share a title idea or the same gameplay. ' +
  (base ? 'Changes compare with ' + nice(base.time) + '.' : 'Changes show from the next update.');
document.getElementById('foot').textContent = 'Data from Roblox’s public charts, updated daily. Games are grouped and the ' +
  'summaries written by Claude (' + D.model + '), so a grouping can occasionally be off. Hover a trend line for each day’s numbers.';
drawTiles();
D.charts.forEach(c => {
  const b = el('button', {'data-v': c, 'aria-pressed': 'false'}, c);
  b.addEventListener('click', () => { chart = c; drawTop(); });
  document.getElementById('chartTabs').append(b);
});
drawTop();
if (gone.length) document.getElementById('gone').append(el('h2', null, 'Trends that left the charts' + since),
  el('ul', null, ...gone.map(([name, v]) => el('li', null, name + ': had ' + full(v[0]) + ' players across ' + v[1] + ' games'))));
document.querySelectorAll('#match button').forEach(b => b.addEventListener('click', () => {
  match = b.dataset.v;
  document.querySelectorAll('#match button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  draw();
}));
document.getElementById('q').addEventListener('input', draw);
document.getElementById('sort').addEventListener('change', draw);
draw();
